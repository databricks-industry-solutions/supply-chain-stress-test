[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ka-chat-bot"
version = "0.1.0"
description = "Databricks Chat Bot Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.2.2",
    "databricks-sdk>=0.62.0",
    "aiofiles>=23.2.1",
    "backoff>=2.2.1",
    "gunicorn>=23.0.0",
    "httpx>=0.25.2",
    "sqlalchemy>=2.0.42",
    "asyncpg>=0.29.0",
    "greenlet>=2.0.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg>=3.2.9",
    "psycopg-binary>=3.2.9",
    "psycopg2-binary>=2.9.10",
    "psycopg-pool>=3.2.6",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=4.0.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.1.0",
    "databricks-langchain>=0.19.0",
    "mlflow[databricks]>=3.5.0,<4.0.0",
    "pyomo>=6.9.2",
    "highspy>=1.10.0",
    "uuid>=1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=26.3.1",
]

[tool.uv]
# Security constraints - minimum versions for known CVE fixes.
# Keep in sync with constraints.txt (used to compile requirements.txt).
constraint-dependencies = [
    "starlette>=1.3.1",
    "werkzeug>=3.1.5",
    "urllib3>=2.7.0",
    "aiohttp>=3.14.1",
    "langchain-core>=1.2.22",
    "langchain>=1.3.9",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "tornado>=6.5.7",
    "marshmallow>=3.26.2",
    "fonttools>=4.61.0",
    "pyasn1>=0.6.4",
    "azure-core>=1.38.0",
    "filelock>=3.20.3",
    "python-dotenv>=1.2.2",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "pillow>=12.3.0",
    "protobuf>=6.33.5",
    "requests>=2.33.0",
    "sqlparse>=0.5.4",
    "orjson>=3.11.6",
    "gitpython>=3.1.52",
    "mako>=1.3.12",
    "mlflow>=3.5.0",
    "setuptools>=83.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "uuid>=1.30",
]
